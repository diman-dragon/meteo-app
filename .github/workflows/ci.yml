name: CI (check + debug APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Atomicity check (one responsibility per file)
        run: npm run check
      - run: npm run build
      - run: npx cap sync android
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build debug APK (signed with the shared dev key)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Show signing certificate (must be identical in every build)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/*.apk | grep -E "Signer #1 certificate SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: meteo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
