name: CI (check + debug APK)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Atomicity check (one responsibility per file)
        run: npm run check
      - run: npm run build
      - run: npx cap sync android
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build debug APK (signed with the shared dev key)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Show signing certificate (must be identical in every build)
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "apksigner: $APKSIGNER"
          echo "apk: $APK"
          "$APKSIGNER" verify --print-certs "$APK" || true
      - uses: actions/upload-artifact@v4
        with:
          name: meteo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
